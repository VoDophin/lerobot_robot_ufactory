# 方案二：双 Pika 遥操双 Piper（升级到 final 参数）。
# 硬件接线：
#   左手 Pika  -> /dev/pika_left （udev 按 USB 物理端口固定）
#   右手 Pika  -> /dev/pika_right
#   左臂 Piper -> can_left，右臂 Piper -> can_right（udev 按 USB 物理端口固定）
# tracker 使用固定硬件序列号绑定；T20/T21 是进程启动时的临时名称，不能写入配置：
#   left=LHR-818D4A5D，right=LHR-52C31F65
# 如更换 Pika，请重新运行 python piper/tools/identify_dual_pika_trackers.py。
# 注意：右手映射矩阵尚未单独标定，默认沿用左手实测矩阵；双臂方向若右手不对，
# 需对右手单独跑测量工具并填入 raw_translation_matrix。
robot:
  type: uf::dual_piper
  id: dual_piper
  parallel_connect: true
  parallel_observation: true
  parallel_action: true
  robots:
    left:
      type: uf::piper
      id: left_piper
      # udev 固定名（按 USB 物理口）：左臂 CAN 适配器 -> can_left
      port: can_left
      control_space: cartesian
      configure_role_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      max_cartesian_step_mm: 6.0
      max_rotation_step_rad: 0.10
      max_cartesian_following_error_mm: 600.0
      max_rotation_following_error_rad: 1.5
      direct_max_step_mm: 6.0
      direct_max_step_rad: 0.10
      translation_deadband_mm: 3.0
      rotation_deadband_rad: 0.02
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 40
      # 双臂首次测试：手动把左右臂摆到安全镜像位姿，不自动移动
      # startup_tcp_pose: [214.476, 3.501, 263.671, -146.447, -7.5, -91.716]
      send_gripper: true
      gripper_effort: 1000
      gripper_ctrl_code: 3
      gripper_command_deadband: 0.005
      gripper_min_command_interval_s: 0.03
      gripper_keepalive_s: 0.20
      cameras: {}
    right:
      type: uf::piper
      id: right_piper
      # 右臂 CAN 适配器 -> can_right
      port: can_right
      control_space: cartesian
      configure_role_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      max_cartesian_step_mm: 6.0
      max_rotation_step_rad: 0.10
      max_cartesian_following_error_mm: 600.0
      max_rotation_following_error_rad: 1.5
      direct_max_step_mm: 6.0
      direct_max_step_rad: 0.10
      translation_deadband_mm: 3.0
      rotation_deadband_rad: 0.02
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 40
      send_gripper: true
      gripper_effort: 1000
      gripper_ctrl_code: 3
      gripper_command_deadband: 0.005
      gripper_min_command_interval_s: 0.03
      gripper_keepalive_s: 0.20
      cameras: {}

teleop:
  type: uf::dual_pika_teleop
  id: dual_pika
  parallel_read: true
  teleops:
    left:
      type: uf::piper_pika_teleop
      id: left_pika
      port: /dev/pika_left
      frequency: 50
      use_gripper: true
      scale_xyz: 0.5
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, 150, 250, 180, 0, 0]
      tracker_device_id: LHR-818D4A5D
      use_raw_translation_mapping: true
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: true
      rotation_style: calibrated
      pose_adaptive_rotation: true
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.6
      rotation_filter_alpha: 0.4
      gripper_use_direct_distance: true
      gripper_distance_min_mm: 0.4
      gripper_distance_max_mm: 98.1
      gripper_filter_window: 3
      gripper_filter_alpha: 0.75
      gripper_deadband: 0.005
      gripper_max_step: 0.15
    right:
      type: uf::piper_pika_teleop
      id: right_pika
      port: /dev/pika_right
      frequency: 50
      use_gripper: true
      scale_xyz: 0.5
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, -150, 250, 180, 0, 0]
      tracker_device_id: LHR-52C31F65
      use_raw_translation_mapping: true
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: true
      rotation_style: calibrated
      pose_adaptive_rotation: true
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.6
      rotation_filter_alpha: 0.4
      gripper_use_direct_distance: true
      gripper_distance_min_mm: 0.4
      gripper_distance_max_mm: 98.1
      gripper_filter_window: 3
      gripper_filter_alpha: 0.75
      gripper_deadband: 0.005
      gripper_max_step: 0.15

fps: 50

dataset:
  root: /home/star/lerobot_data/dual_pika_piper
  repo_id: local/dual_pika_piper
  single_task: Bimanual Pika to Piper teleoperation
  fps: 50
  episode_time_s: 30
  reset_time_s: 20
  num_episodes: 50
  push_to_hub: false
