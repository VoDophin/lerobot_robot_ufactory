# Pika -> Piper movep_step_v14（V14 保留版）: MOVE P 阶梯限幅遥操。
# User feedback on V13: the Piper only follows at a constant speed and falls
# behind when the Pika accelerates (plus slight jitter). MOVE P plans each
# segment at a fixed speed, so the two caps that bind during acceleration are
# raised: actual speed 20 -> 30%, commanded rate 3.6 -> 5.0 mm / cycle
# (180 -> 250 mm/s) and 0.06 -> 0.08 rad / cycle (~230 deg/s).
# 1:1 scales, 50 Hz, deadbands and the measured translation matrix stay.
robot:
  type: uf::piper
  id: piper_follower
  port: can0
  control_space: cartesian
  configure_role_on_connect: true
  park_on_connect: false
  park_on_disconnect: false
  disable_torque_on_disconnect: false

  workspace_x: [100.0, 600.0]
  workspace_y: [-500.0, 500.0]
  workspace_z: [50.0, 600.0]
  max_cartesian_step_mm: 5.0
  max_rotation_step_rad: 0.08
  translation_deadband_mm: 0.5
  rotation_deadband_rad: 0.004
  move_mode: move_p
  move_speed_percent: 30
  min_command_interval_s: 0.02
  lock_orientation: false

  send_gripper: true
  gripper_effort: 1000
  gripper_ctrl_code: 3
  gripper_command_deadband: 0.005
  gripper_min_command_interval_s: 0.03
  gripper_keepalive_s: 0.20
  cameras: {}

teleop:
  type: uf::piper_pika_teleop
  id: pika_piper_movep_step_v14
  port: /dev/ttyUSB50
  frequency: 100
  use_gripper: true
  scale_xyz: 1.0
  tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
  robot_base_pose: [300, 0, 250, 180, 0, 0]

  use_raw_translation_mapping: true

  use_calibrated_rotation_mapping: true
  apply_piper_tool_axis_correction: true
  rotation_dominant_axis: false
  rotation_scale: 1.0
  rotation_filter_alpha: 0.4

  # Direct physical-opening mapping for the official Piper gripper.
  gripper_use_direct_distance: true
  gripper_distance_min_mm: 0.4
  gripper_distance_max_mm: 98.1
  gripper_filter_window: 3
  gripper_filter_alpha: 0.75
  gripper_deadband: 0.005
  gripper_max_step: 0.15

fps: 50

dataset:
  root: /home/admin1/lerobot_data/single_pika_piper_movep_step_v14
  repo_id: local/single_pika_piper_movep_step_v14
  single_task: Pika to Piper MOVE P step teleoperation
  fps: 50
  episode_time_s: 10
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
