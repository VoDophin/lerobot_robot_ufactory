# Second dual-arm hardware test: low-speed orientation, no grippers.
# Translation remains enabled at a very small scale so the Pika target stays
# continuous while the operator rotates around a roughly fixed hand position.
robot:
  type: uf::dual_piper
  id: dual_piper_orientation_preflight
  parallel_connect: true
  parallel_observation: true
  parallel_action: true
  robots:
    left:
      type: uf::piper
      id: left_piper
      port: can_left
      control_space: cartesian
      configure_role_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      max_cartesian_step_mm: 2.0
      max_rotation_step_rad: 0.01
      max_cartesian_following_error_mm: 80.0
      max_rotation_following_error_rad: 0.35
      direct_max_step_mm: 2.0
      direct_max_step_rad: 0.01
      translation_deadband_mm: 2.0
      rotation_deadband_rad: 0.006
      lock_orientation: false
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 10
      send_gripper: false
      cameras: {}
    right:
      type: uf::piper
      id: right_piper
      port: can_right
      control_space: cartesian
      configure_role_on_connect: true
      park_on_connect: false
      park_on_disconnect: false
      disable_torque_on_disconnect: false
      hold_position_on_disconnect: true
      feedback_startup_timeout_s: 5.0
      cartesian_command_mode: direct
      max_cartesian_step_mm: 2.0
      max_rotation_step_rad: 0.01
      max_cartesian_following_error_mm: 80.0
      max_rotation_following_error_rad: 0.35
      direct_max_step_mm: 2.0
      direct_max_step_rad: 0.01
      translation_deadband_mm: 2.0
      rotation_deadband_rad: 0.006
      lock_orientation: false
      workspace_x: [50.0, 600.0]
      workspace_y: [-500.0, 500.0]
      workspace_z: [50.0, 600.0]
      move_mode: move_p
      move_speed_percent: 10
      send_gripper: false
      cameras: {}

teleop:
  type: uf::dual_pika_teleop
  id: dual_pika_orientation_preflight
  parallel_read: true
  teleops:
    left:
      type: uf::piper_pika_teleop
      id: left_pika
      port: /dev/pika_left
      frequency: 50
      use_gripper: false
      scale_xyz: 0.05
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, 150, 250, 180, 0, 0]
      tracker_device_id: LHR-818D4A5D
      use_raw_translation_mapping: true
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: true
      rotation_style: calibrated
      pose_adaptive_rotation: true
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.20
      rotation_filter_alpha: 0.35
    right:
      type: uf::piper_pika_teleop
      id: right_pika
      port: /dev/pika_right
      frequency: 50
      use_gripper: false
      scale_xyz: 0.05
      tracker_to_robot_eef: [0, 0, 0, 180, -90, 0]
      robot_base_pose: [300, -150, 250, 180, 0, 0]
      tracker_device_id: LHR-52C31F65
      use_raw_translation_mapping: true
      use_calibrated_rotation_mapping: true
      apply_piper_tool_axis_correction: true
      rotation_style: calibrated
      pose_adaptive_rotation: true
      rotation_mapping_matrix: [
        [0.000000000, 0.991000235, -0.130526192],
        [0.000000000, 0.047154810, 0.547979619],
        [-1.000000000, 0.125279522, 0.826245272],
      ]
      rotation_dominant_axis: false
      rotation_scale: 0.20
      rotation_filter_alpha: 0.35

fps: 50

dataset:
  root: /home/star/lerobot_data/dual_pika_piper_orientation_preflight
  repo_id: local/dual_pika_piper_orientation_preflight
  single_task: Low-speed dual Pika to dual Piper orientation preflight
  fps: 50
  episode_time_s: 15
  reset_time_s: 20
  num_episodes: 1
  push_to_hub: false
