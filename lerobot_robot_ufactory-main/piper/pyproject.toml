[build-system]
requires = ["setuptools>=68.0", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_ufactory_piper"
version = "0.1.0"
description = "Non-invasive dual-arm Piper integration for lerobot_robot_ufactory"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "lerobot==0.4.3",
    "numpy>=1.24",
    "pyyaml",
    "piper_sdk>=0.3.0",
    "wego_piper",
]

[project.scripts]
uf-piper-record = "lerobot_robot_ufactory_piper.scripts.record:main"
uf-piper-teleop = "lerobot_robot_ufactory_piper.scripts.teleoperate:main"
uf-piper-check-config = "lerobot_robot_ufactory_piper.scripts.check_config:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

